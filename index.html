<!DOCTYPE html>
<html lang="ru" class="min-h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Finance Dashboard — Finlite DB</title>

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="./icon.png">
    <meta name="theme-color" content="#0d120f">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>

    <style>
        html, body {
            min-height: 100%;
            max-width: 100vw;
            overflow-x: hidden !important;
            overflow-y: auto !important;
            overscroll-behavior-y: none;
        }

        *, *::before, *::after {
            box-sizing: border-box !important;
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        body.theme-dark {
            background-color: #0d120f;
            color: #f4f4f0;
        }
        .theme-dark .glow-bg {
            background:
                radial-gradient(circle at 20% 20%, rgba(16, 44, 25, 0.8) 0%, transparent 40%),
                radial-gradient(circle at 80% 40%, rgba(163, 230, 53, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(245, 245, 220, 0.08) 0%, transparent 60%);
        }
        .theme-dark .glass-card {
            background: rgba(20, 29, 24, 0.65);
            border: 1px solid rgba(163, 230, 53, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .theme-dark .glass-card:hover {
            border-color: rgba(163, 230, 53, 0.35);
        }
        .theme-dark .input-dark {
            background-color: #141d18;
            border-color: rgba(63, 63, 70, 0.8);
            color: #e4e4e7;
        }
        .theme-dark .text-muted { color: #a8a29e; }
        .theme-dark .text-title { color: #e7e5e4; }
        .theme-dark .btn-rule-add {
            background-color: #27272a;
            color: #f4f4f0;
        }
        .theme-dark .btn-rule-add:hover {
            background-color: #3f3f46;
        }

        body.theme-light {
            background-color: #fcfbf7;
            color: #1c241f;
        }
        .theme-light .glow-bg {
            background:
                radial-gradient(circle at 20% 20%, rgba(217, 249, 157, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 80% 40%, rgba(204, 251, 241, 0.3) 0%, transparent 50%);
        }
        .theme-light .glass-card {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(22, 58, 33, 0.12);
            box-shadow: 0 8px 32px 0 rgba(22, 58, 33, 0.04);
        }
        .theme-light .input-dark {
            background-color: #f4f3ee;
            border-color: rgba(212, 212, 216, 1);
            color: #1c241f;
        }
        .theme-light .text-muted { color: #71717a; }
        .theme-light .text-title { color: #1c241f; }
        .theme-light .btn-rule-add {
            background-color: #e4e4e7;
            color: #18181b;
        }
        .theme-light .btn-rule-add:hover {
            background-color: #d4d4d8;
        }

        .accent-lime { color: #a3e635; }
        .theme-light .accent-lime { color: #4d7c0f; }

        .glow-bg-container {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: -1;
            pointer-events: none;
        }

        .glow-bg {
            position: absolute;
            inset: 0;
            filter: blur(60px);
            transition: background 0.8s ease-in-out;
        }

        .glass-card {
            backdrop-filter: blur(12px);
            transition: transform 0.2s ease, border-color 0.3s ease, background-color 0.3s ease;
        }

        .btn-gradient {
            background: linear-gradient(135deg, #163a21 0%, #a3e635 100%);
            color: #0d120f;
            font-weight: 600;
        }
        .theme-light .btn-gradient {
            background: linear-gradient(135deg, #4d7c0f 0%, #a3e635 100%);
            color: #ffffff;
        }

        .input-dark {
            width: 100%;
            border-radius: 0.75rem;
            padding: 0.625rem 0.875rem;
            transition: border-color 0.2s, background-color 0.3s;
        }
        .input-dark:focus {
            outline: none;
            border-color: #a3e635;
        }

        .draggable-item {
            cursor: grab;
            user-select: none;
            touch-action: pan-y;
        }
        .draggable-item:active { cursor: grabbing; }
        .draggable-item.dragging {
            opacity: 0.35;
            transform: scale(0.98);
        }

        .drop-placeholder {
            border-radius: 0.75rem;
            height: 56px;
            transition: all 0.2s ease-in-out;
        }
        .drop-placeholder.internal {
            border: 2px dashed #a3e635;
            background: rgba(163, 230, 53, 0.08);
        }
        .drop-placeholder.foreign {
            border: 2px dashed #f59e0b;
            background: rgba(245, 158, 11, 0.12);
        }
    </style>
</head>
<body class="theme-dark min-h-screen flex flex-col antialiased">

    <div class="glow-bg-container">
        <div class="glow-bg"></div>
    </div>

    <header class="w-full border-b border-zinc-800/40 sticky top-0 backdrop-blur-md z-10">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2 min-w-0">
                <div class="w-3.5 h-3.5 rounded-full bg-lime-400 animate-pulse shrink-0"></div>
                <span class="text-lg font-bold tracking-wider text-title truncate">Finlite <span class="accent-lime">DB</span></span>
            </div>
            <div class="flex items-center gap-4 shrink-0">
                <span id="btn-templates" class="accent-lime font-semibold select-none text-xs sm:text-sm">Шаблоны распределения</span>
                <button onclick="toggleTheme()" class="p-2 rounded-xl bg-zinc-800/30 hover:bg-zinc-800/60 cursor-pointer text-base transition" title="Сменить тему">
                    🌗
                </button>
            </div>
        </div>
    </header>

    <main class="w-full max-w-6xl mx-auto px-4 py-6 flex-1">
        <div id="templates-page" class="grid grid-cols-1 lg:grid-cols-3 gap-6 w-full min-w-0">

            <section id="active-templates-container" class="lg:col-span-2 flex flex-col gap-8 w-full min-w-0">
                <div class="text-center py-12 text-muted italic">Загрузка сохраненных листов распределения...</div>
            </section>

            <section class="lg:col-span-1 w-full min-w-0">
                <div class="flex flex-col gap-6 sticky top-20 w-full min-w-0">

                    <div class="glass-card p-4 sm:p-5 rounded-2xl border-l-4 border-l-lime-400 w-full min-w-0">
                        <h2 class="text-base font-bold text-title mb-1">Запустить расчёт</h2>
                        <p class="text-xs text-muted mb-4">Укажите название существующего шаблона и сумму</p>

                        <div class="flex flex-col gap-3">
                            <div>
                                <label class="block text-[11px] text-muted mb-1">Название шаблона в системе</label>
                                <input type="text" id="calc-template-name" list="templates-list" placeholder="Выберите или введите название..." class="input-dark text-xs" autocomplete="off">
                                <datalist id="templates-list"></datalist>
                            </div>
                            <div>
                                <label class="block text-[11px] text-muted mb-1">Сумма поступления (₸)</label>
                                <input type="number" id="calc-amount" placeholder="Например: 55000" class="input-dark text-xs">
                            </div>
                            <button id="btn-calc" class="w-full btn-gradient py-2.5 rounded-xl text-xs cursor-pointer mt-1">
                                Рассчитать бюджет
                            </button>
                        </div>
                    </div>

                    <div class="glass-card p-4 sm:p-5 rounded-2xl w-full min-w-0">
                        <h2 class="text-base font-bold text-title mb-1">Создание шаблона</h2>
                        <p class="text-xs text-muted mb-3">Формирование цепочки правил распределения</p>

                        <div class="flex flex-col gap-3">
                            <div>
                                <label class="block text-[11px] text-muted mb-1">Название шаблона</label>
                                <input type="text" id="tpl-name" placeholder="Например: Зарплата" class="input-dark text-xs">
                            </div>

                            <div class="border-t border-zinc-800/60 pt-3">
                                <span class="text-[10px] uppercase tracking-wider font-bold accent-lime block mb-2">Конструктор правил</span>

                                <div class="flex flex-col gap-2 bg-zinc-900/30 p-3 rounded-xl border border-zinc-800/40 mb-2 min-w-0">
                                    <input type="text" id="rule-title" placeholder="Название (например: На проезд)" class="input-dark text-xs">
                                    <input type="text" id="rule-desc" placeholder="Описание/Комментарий..." class="input-dark text-xs">

                                    <div class="grid grid-cols-2 gap-2">
                                        <select id="payment-type" class="input-dark text-xs">
                                            <option value="fix">Фикс сумма</option>
                                            <option value="percentage">Процент %</option>
                                        </select>
                                        <input type="number" id="rule-value" placeholder="Значение" class="input-dark text-xs">
                                    </div>

                                    <button id="btn-add-rule" class="w-full btn-rule-add font-medium text-[11px] py-2 rounded-lg cursor-pointer transition">
                                        + Добавить правило в список
                                    </button>
                                </div>

                                <div id="temp-rules-list" class="text-[11px] text-muted flex flex-col gap-1.5 max-h-32 overflow-y-auto mb-2 p-1">
                                    <span class="italic text-zinc-600 p-1">Список правил пуст</span>
                                </div>
                            </div>

                            <button id="btn-save-tpl" class="w-full btn-gradient py-2.5 rounded-xl cursor-pointer text-xs">
                                Сохранить шаблон локально
                            </button>
                        </div>
                    </div>

                </div>
            </section>
        </div>
    </main>

    <script type="module">
        import { executeBudgetSimulation } from './engine.js';
        import {
            getAllTemplatesDB,
            getTemplateDB,
            saveTemplateDB,
            deleteTemplateDB,
            updateTemplatePaymentsDB
        } from './db.js';

        let currentTemplatePayments = [];
        let draggedItem = null;
        let originIndex = null;
        let donorTemplateName = null;
        let placeholder = null;

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register(`./sw.js?v=${Date.now()}`)
                .then(reg => reg.update())
                .catch(err => console.error(err));
        }

        const formatMoney = (amount) => {
            return new Intl.NumberFormat('ru-KZ', {
                style: 'currency',
                currency: 'KZT',
                maximumFractionDigits: 0
            }).format(amount);
        };

        window.toggleTheme = function() {
            const body = document.body;
            body.classList.toggle('theme-dark');
            body.classList.toggle('theme-light');
        };

        function validateNumberInput(value) {
            const clean = value.toString().trim().replace(',', '.');
            if (clean === '' || isNaN(Number(clean)) || Number(clean) < 0) {
                alert("⚠️ Ошибка: Введено некорректное значение!");
                return null;
            }
            return Number(clean);
        }

        function populateTemplatesDropdown(templates) {
            const datalist = document.getElementById('templates-list');
            if (!datalist) return;
            datalist.innerHTML = templates.map(tpl => `<option value="${tpl.name}"></option>`).join('');
        }

        async function loadAllTemplates() {
            const container = document.getElementById('active-templates-container');
            try {
                const templates = await getAllTemplatesDB();
                populateTemplatesDropdown(templates);

                if (templates.length === 0) {
                    container.innerHTML = '<div class="text-center py-12 text-muted italic">В локальной базе нет шаблонов. Создайте первый на панели справа!</div>';
                    return;
                }

                container.innerHTML = templates.map(tpl => {
                    const rulesHtml = tpl.payments.map((p, idx) => {
                        const isPercent = p.type === 'percentage' || p.__type__ === 'Percentage';
                        const badgeText = isPercent ? '%' : '₸';
                        const displayValue = isPercent ? `-${p.value}%` : `-${formatMoney(p.value)}`;
                        const borderHighlight = isPercent ? 'border-l-2 border-l-rose-500/80' : 'border-l-2 border-l-lime-500/80';

                        return `
                            <div draggable="true"
                                 data-index="${idx}"
                                 data-template="${tpl.name}"
                                 class="draggable-item glass-card p-3 rounded-xl flex items-center justify-between gap-2 ${borderHighlight} w-full min-w-0">

                                <div class="flex items-center gap-2.5 min-w-0 flex-1">
                                    <span class="w-5 h-5 rounded-full bg-zinc-800 border border-zinc-700 text-[10px] font-bold text-center leading-5 text-zinc-400 shrink-0">${idx + 1}</span>
                                    <div class="min-w-0 flex-1">
                                        <div class="flex items-center gap-1.5 flex-wrap">
                                            <h4 class="font-semibold text-title text-xs truncate max-w-full">${p.description || 'Без описания'}</h4>
                                            <span class="text-[9px] px-1 py-0.2 rounded bg-zinc-800 text-zinc-400 border border-zinc-700/50 uppercase shrink-0">${badgeText}</span>
                                        </div>
                                    </div>
                                </div>

                                <div class="flex items-center gap-2 shrink-0">
                                    <span class="text-xs font-bold text-rose-500 whitespace-nowrap">${displayValue}</span>

                                    <button title="Перетащить" class="drag-handle p-1.5 rounded-lg bg-zinc-800/40 text-zinc-400 hover:text-zinc-200 cursor-grab">
                                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="8 7 12 3 16 7"/><polyline points="8 17 12 21 16 17"/><line x1="12" y1="3" x2="12" y2="21"/></svg>
                                    </button>

                                    <button data-action="delete-rule" data-template="${tpl.name}" data-index="${idx}" title="Удалить" class="p-1.5 rounded-lg bg-rose-950/30 text-rose-400 hover:bg-rose-900/50 cursor-pointer">
                                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                                    </button>
                                </div>
                            </div>
                        `;
                    }).join('');

                    return `
                        <div class="flex flex-col gap-3 w-full min-w-0">
                            <div class="flex items-center justify-between border-b border-zinc-800/50 pb-2 gap-2 w-full">
                                <div class="min-w-0 flex-1">
                                    <h2 class="text-lg font-bold tracking-tight text-title truncate">${tpl.name}</h2>
                                </div>
                                <button data-action="delete-template" data-template="${tpl.name}" class="px-2.5 py-1 text-xs bg-rose-950/40 hover:bg-rose-900 text-rose-400 rounded-lg transition font-medium border border-rose-900/30 cursor-pointer shrink-0">
                                     Удалить
                                </button>
                            </div>
                            <div class="rules-container flex flex-col gap-2 min-h-[40px] w-full min-w-0" data-template="${tpl.name}">
                                ${rulesHtml}
                            </div>
                        </div>
                    `;
                }).join('');

                initDragAndDrop();
                bindDynamicEvents();

            } catch (err) {
                container.innerHTML = `<div class="text-center py-12 text-rose-400 italic">Ошибка чтения локальной базы IndexedDB: ${err.message}</div>`;
            }
        }

        function initDragAndDrop() {
            const containers = document.querySelectorAll('.rules-container');
            placeholder = document.createElement('div');
            placeholder.className = 'drop-placeholder';

            containers.forEach(container => {
                const items = container.querySelectorAll('.draggable-item');

                items.forEach(item => {
                    item.addEventListener('dragstart', () => {
                        draggedItem = item;
                        originIndex = parseInt(item.getAttribute('data-index'));
                        donorTemplateName = item.getAttribute('data-template');
                        setTimeout(() => item.classList.add('dragging'), 0);
                    });

                    item.addEventListener('dragend', async () => {
                        item.classList.remove('dragging');

                        if (placeholder.parentNode) {
                            const targetContainer = placeholder.parentNode;
                            const targetTemplateName = targetContainer.getAttribute('data-template');

                            let targetIndex = 0;
                            const childrenArr = Array.from(targetContainer.children);
                            for (let i = 0; i < childrenArr.length; i++) {
                                if (childrenArr[i] === placeholder) break;
                                if (childrenArr[i] !== draggedItem) targetIndex++;
                            }

                            placeholder.parentNode.replaceChild(draggedItem, placeholder);
                            draggedItem.setAttribute('data-template', targetTemplateName);

                            if (donorTemplateName === targetTemplateName) {
                                const tpl = await getTemplateDB(donorTemplateName);
                                const movedRule = tpl.payments.splice(originIndex, 1)[0];
                                tpl.payments.splice(targetIndex, 0, movedRule);
                                await updateTemplatePaymentsDB(donorTemplateName, tpl.payments);
                            } else {
                                const donorTpl = await getTemplateDB(donorTemplateName);
                                const targetTpl = await getTemplateDB(targetTemplateName);
                                const movedRule = donorTpl.payments.splice(originIndex, 1)[0];
                                targetTpl.payments.splice(targetIndex, 0, movedRule);

                                await updateTemplatePaymentsDB(donorTemplateName, donorTpl.payments);
                                await updateTemplatePaymentsDB(targetTemplateName, targetTpl.payments);
                            }

                            await loadAllTemplates();
                        }

                        draggedItem = null;
                        originIndex = null;
                        donorTemplateName = null;
                        placeholder.className = 'drop-placeholder';
                    });
                });

                container.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    if (!draggedItem) return;

                    const currentTargetTemplate = container.getAttribute('data-template');
                    placeholder.className = currentTargetTemplate === donorTemplateName ? 'drop-placeholder internal' : 'drop-placeholder foreign';

                    const afterElement = getDragAfterElement(container, e.clientY);
                    if (afterElement == null) {
                        container.appendChild(placeholder);
                    } else {
                        container.insertBefore(placeholder, afterElement);
                    }
                });
            });
        }

        function getDragAfterElement(container, y) {
            const draggableElements = [...container.querySelectorAll('.draggable-item:not(.dragging)')];
            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;
                if (offset < 0 && offset > closest.offset) {
                    return { offset: offset, element: child };
                } else {
                    return closest;
                }
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        function bindDynamicEvents() {
            document.querySelectorAll('[data-action="delete-rule"]').forEach(btn => {
                btn.onclick = async () => {
                    const name = btn.getAttribute('data-template');
                    const idx = parseInt(btn.getAttribute('data-index'));
                    if (confirm(`Удалить правило №${idx + 1}?`)) {
                        const tpl = await getTemplateDB(name);
                        tpl.payments.splice(idx, 1);
                        await updateTemplatePaymentsDB(name, tpl.payments);
                        await loadAllTemplates();
                    }
                };
            });

            document.querySelectorAll('[data-action="delete-template"]').forEach(btn => {
                btn.onclick = async () => {
                    const name = btn.getAttribute('data-template');
                    if (confirm(`Удалить шаблон "${name}"?`)) {
                        await deleteTemplateDB(name);
                        await loadAllTemplates();
                    }
                };
            });
        }

        document.getElementById('btn-add-rule').onclick = () => {
            const title = document.getElementById('rule-title').value.trim();
            const desc = document.getElementById('rule-desc').value.trim();
            const type = document.getElementById('payment-type').value;
            const rawValue = document.getElementById('rule-value').value;

            const value = validateNumberInput(rawValue);
            if (value === null || !title) {
                if (!title) alert("Введите название правила!");
                return;
            }

            const finalDescription = desc ? `${title} (${desc})` : title;
            currentTemplatePayments.push({ type, value, description: finalDescription });

            document.getElementById('rule-title').value = '';
            document.getElementById('rule-desc').value = '';
            document.getElementById('rule-value').value = '';

            renderTempRules();
        };

        function renderTempRules() {
            const container = document.getElementById('temp-rules-list');
            if (currentTemplatePayments.length === 0) {
                container.innerHTML = '<span class="italic text-zinc-600 p-1">Список правил пуст</span>';
                return;
            }
            container.innerHTML = currentTemplatePayments.map((p, idx) =>
                `<div class="p-1.5 bg-zinc-900/10 dark:bg-zinc-900/80 border border-zinc-400/30 dark:border-zinc-800 rounded-lg text-title flex justify-between items-center text-[11px] gap-2 min-w-0">
                    <span class="truncate min-w-0"><b>${idx + 1}. ${p.type === 'fix' ? 'ФИКС' : '%'}</b>: ${p.value}${p.type === 'fix' ? ' ₸' : '%'} — <i>${p.description}</i></span>
                    <button data-remove-temp="${idx}" class="text-rose-500 font-bold shrink-0 px-1">✕</button>
                 </div>`
            ).join('');

            container.querySelectorAll('[data-remove-temp]').forEach(btn => {
                btn.onclick = () => {
                    const idx = parseInt(btn.getAttribute('data-remove-temp'));
                    currentTemplatePayments.splice(idx, 1);
                    renderTempRules();
                };
            });
        }

        document.getElementById('btn-save-tpl').onclick = async () => {
            const name = document.getElementById('tpl-name').value.trim();
            if (!name || currentTemplatePayments.length === 0) {
                alert("Введите имя шаблона и наберите список правил!");
                return;
            }

            await saveTemplateDB(name, currentTemplatePayments);
            currentTemplatePayments = [];
            document.getElementById('tpl-name').value = '';
            renderTempRules();
            await loadAllTemplates();
        };

        document.getElementById('btn-calc').onclick = async () => {
            const templateName = document.getElementById('calc-template-name').value.trim();
            const rawAmount = document.getElementById('calc-amount').value;

            const amount = validateNumberInput(rawAmount);
            if (amount === null || !templateName) {
                if (!templateName) alert("Укажите имя шаблона!");
                return;
            }

            const template = await getTemplateDB(templateName);
            if (!template) {
                alert(`Шаблон "${templateName}" не найден!`);
                return;
            }

            const result = executeBudgetSimulation(template, amount);
            renderCalculationOutput(result);
        };

        function renderCalculationOutput(r) {
            const container = document.getElementById('active-templates-container');
            const oldResult = document.getElementById('calc-output-card');
            if (oldResult) oldResult.remove();

            const historyItems = (r.history || []).map(item => {
                let statusBadge = '';
                let borderStyle = 'border-zinc-800/60';
                let displayDeducted = '';

                if (item.status === 'ok') {
                    statusBadge = '<span class="text-[10px] text-emerald-500 font-semibold">Успешно</span>';
                } else if (item.status === 'insufficient_funds') {
                    statusBadge = '<span class="text-[10px] text-rose-500 font-semibold">Ошибка</span>';
                    borderStyle = 'border-rose-500/50 bg-rose-950/20';
                } else if (item.status === 'zero_balance_stop') {
                    statusBadge = '<span class="text-[10px] text-amber-500 font-semibold">Баланс 0 ₸</span>';
                    borderStyle = 'border-amber-500/50 bg-amber-950/20';
                }

                if (item.type === 'percentage') {
                    displayDeducted = `${item.value}% (${formatMoney(item.deducted_amount)})`;
                } else {
                    displayDeducted = formatMoney(item.deducted_amount);
                }

                return `
                    <div class="glass-card p-2.5 rounded-xl border ${borderStyle} flex flex-col gap-1 text-xs w-full min-w-0">
                        <div class="flex justify-between items-center gap-2 min-w-0">
                            <span class="font-bold text-title truncate flex-1 min-w-0">${item.step}. ${item.description}</span>
                            ${statusBadge}
                        </div>
                        <div class="flex justify-between items-center text-muted text-[11px] mt-1 gap-2 flex-wrap">
                            <span>Сумма: <b class="text-rose-500">${displayDeducted}</b></span>
                            <span>Остаток: <b class="accent-lime">${formatMoney(item.balance_after)}</b></span>
                        </div>
                    </div>
                `;
            }).join('');

            const outputHtml = `
                <div id="calc-output-card" class="glass-card p-4 sm:p-5 rounded-2xl border-l-4 ${r.success ? 'border-l-lime-500' : 'border-l-rose-500'} mb-4 w-full min-w-0">
                    <div class="flex justify-between items-center mb-3 gap-2">
                        <div class="min-w-0 flex-1">
                            <h3 class="text-base font-bold text-title truncate">${r.template_name}</h3>
                            <p class="text-xs text-muted">Исходный: ${formatMoney(r.initial_amount)} | Остаток: ${formatMoney(r.final_balance)}</p>
                        </div>
                        <button onclick="document.getElementById('calc-output-card').remove()" class="text-muted hover:text-title text-sm cursor-pointer shrink-0 p-1">✕</button>
                    </div>

                    <div class="flex flex-col gap-2 w-full min-w-0">
                        ${historyItems}
                    </div>
                </div>
            `;

            container.insertAdjacentHTML('afterbegin', outputHtml);
        }

        window.addEventListener('DOMContentLoaded', loadAllTemplates);
    </script>
</body>
</html>
