<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Dashboard — Finlite DB</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        * {
            transition: background-color 0.6s cubic-bezier(0.4, 0, 0.2, 1),
                        border-color 0.6s cubic-bezier(0.4, 0, 0.2, 1),
                        color 0.4s ease;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        body.theme-dark {
            background-color: #0d120f;
            color: #f4f4f0;
        }
        .theme-dark .glow-bg {
            background:
                radial-gradient(circle at 20% 20%, rgba(16, 44, 25, 0.8) 0%, transparent 40%),
                radial-gradient(circle at 80% 40%, rgba(163, 230, 53, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(245, 245, 220, 0.08) 0%, transparent 60%);
        }
        .theme-dark .glass-card {
            background: rgba(20, 29, 24, 0.6);
            border: 1px solid rgba(163, 230, 53, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .theme-dark .glass-card:hover {
            border-color: rgba(163, 230, 53, 0.4);
            box-shadow: 0 8px 32px 0 rgba(163, 230, 53, 0.1);
        }
        .theme-dark .input-dark {
            background-color: #141d18;
            border-color: rgba(63, 63, 70, 1);
            color: #e4e4e7;
        }
        .theme-dark .text-muted { color: #a8a29e; }
        .theme-dark .text-title { color: #e7e5e4; }

        body.theme-light {
            background-color: #fcfbf7;
            color: #1c241f;
        }
        .theme-light .glow-bg {
            background:
                radial-gradient(circle at 20% 20%, rgba(217, 249, 157, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 80% 40%, rgba(204, 251, 241, 0.3) 0%, transparent 50%);
        }
        .theme-light .glass-card {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(22, 58, 33, 0.12);
            box-shadow: 0 8px 32px 0 rgba(22, 58, 33, 0.04);
        }
        .theme-light .glass-card:hover {
            border-color: rgba(77, 124, 15, 0.4);
            box-shadow: 0 8px 32px 0 rgba(77, 124, 15, 0.08);
        }
        .theme-light .input-dark {
            background-color: #f4f3ee;
            border-color: rgba(212, 212, 216, 1);
            color: #1c241f;
        }
        .theme-light .input-dark:focus {
            border-color: #4d7c0f;
        }
        .theme-light .text-muted { color: #71717a; }
        .theme-light .text-title { color: #1c241f; }

        .accent-lime { color: #a3e635; }
        .theme-light .accent-lime { color: #4d7c0f; }

        .glow-bg {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 150%;
            height: 150%;
            z-index: -1;
            filter: blur(80px);
            transition: background 0.8s ease-in-out;
        }

        .glass-card {
            backdrop-filter: blur(12px);
            transition: transform 0.3s ease, border-color 0.5s ease, background-color 0.6s ease, box-shadow 0.6s ease;
        }
        .glass-card:hover {
            transform: translateY(-2px);
        }

        .btn-gradient {
            background: linear-gradient(135deg, #163a21 0%, #a3e635 100%);
            color: #0d120f;
            font-weight: 600;
            transition: opacity 0.2s, transform 0.1s;
        }
        .theme-light .btn-gradient {
            background: linear-gradient(135deg, #4d7c0f 0%, #a3e635 100%);
            color: #ffffff;
        }
        .btn-gradient:hover { opacity: 0.9; }
        .btn-gradient:active { transform: scale(0.98); }

        .input-dark {
            width: 100%;
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            transition: border-color 0.2s, background-color 0.6s, color 0.4s;
        }
        .input-dark:focus {
            outline: none;
            border-color: #a3e635;
        }

        /* --- Стили для плавного Drag & Drop --- */
        .draggable-item {
            cursor: grab;
            user-select: none;
            transition: transform 0.25s cubic-bezier(0.2, 0, 0, 1), box-shadow 0.25s ease, opacity 0.25s ease;
        }
        .draggable-item:active {
            cursor: grabbing;
        }
        .draggable-item.dragging {
            opacity: 0.35;
            transform: scale(0.98);
        }

        /* Посадочная точка (Базовый стили) */
        .drop-placeholder {
            border-radius: 0.75rem;
            height: 60px;
            transition: all 0.2s ease-in-out;
            animation: pulse-border 1.5s infinite alternate;
        }

        /* Внутри своего шаблона -> Зеленый цвет */
        .drop-placeholder.internal {
            border: 2px dashed #a3e635;
            background: rgba(163, 230, 53, 0.08);
        }
        .theme-light .drop-placeholder.internal {
            border-color: #4d7c0f;
            background: rgba(77, 124, 15, 0.08);
        }

        /* При перетаскивании в ДРУГОЙ шаблон -> Желтый/Янтарный цвет */
        .drop-placeholder.foreign {
            border: 2px dashed #f59e0b;
            background: rgba(245, 158, 11, 0.12);
        }
        .theme-light .drop-placeholder.foreign {
            border-color: #d97706;
            background: rgba(217, 119, 6, 0.12);
        }

        @keyframes pulse-border {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body class="theme-dark relative min-h-screen pb-12">

    <div class="glow-bg"></div>

    <nav class="w-full max-w-6xl mx-auto px-6 py-6 flex justify-between items-center border-b border-zinc-800/40">
        <div class="flex items-center gap-2">
            <div class="w-4 h-4 rounded-full bg-lime-400 animate-pulse"></div>
            <span class="text-xl font-bold tracking-wider text-title">Finlite <span class="accent-lime">DB</span></span>
        </div>
        <div class="flex items-center gap-6 text-sm">
            <span id="btn-templates" class="text-lime-400 font-semibold select-none">Шаблоны распределения</span>

            <button onclick="toggleTheme()" class="ml-2 p-2 rounded-xl bg-zinc-800/20 hover:bg-zinc-800/50 cursor-pointer text-lg transition" title="Сменить тему">
                🌗
            </button>
        </div>
    </nav>

    <main class="w-full max-w-6xl mx-auto px-6 mt-8">

        <div id="templates-page" class="tab-content grid grid-cols-1 lg:grid-cols-3 gap-8">

            <section id="active-templates-container" class="lg:col-span-2 flex flex-col gap-12">
                <div class="text-center py-12 text-muted italic">Загрузка сохраненных листов распределения...</div>
            </section>

            <section class="lg:col-span-1">
                <div class="flex flex-col gap-6 sticky top-6">

                    <div class="glass-card p-6 rounded-2xl border-l-4 border-l-lime-400">
                        <h2 class="text-lg font-bold mb-1 text-title flex items-center gap-2">Запустить расчёт</h2>
                        <p class="text-xs text-muted mb-4">Укажите название существующего шаблона и сумму</p>

                        <div class="flex flex-col gap-3">
                            <div>
                                <label class="block text-[11px] text-muted mb-1">Название шаблона в системе</label>
                                <input type="text" id="calc-template-name" list="templates-list" placeholder="Выберите или введите название..." class="input-dark py-2 text-sm" autocomplete="off">
                                <datalist id="templates-list"></datalist>
                            </div>
                            <div>
                                <label class="block text-[11px] text-muted mb-1">Сумма поступления (₸)</label>
                                <input type="text" id="calc-amount" placeholder="Например: 55000" class="input-dark py-2 text-sm">
                            </div>
                            <button onclick="sendToCalculation()" class="w-full btn-gradient py-2.5 rounded-xl text-sm cursor-pointer mt-1">
                                Рассчитать бюджет
                            </button>
                        </div>
                    </div>

                    <div class="glass-card p-6 rounded-2xl">
                        <h2 class="text-lg font-bold mb-1 text-title flex items-center gap-2">Создание шаблона</h2>
                        <p class="text-xs text-muted mb-4">Формирование цепочки правил распределения</p>

                        <div class="flex flex-col gap-3">
                            <div>
                                <label class="block text-[11px] text-muted mb-1">Название шаблона</label>
                                <input type="text" id="tpl-name" placeholder="Например: Зарплата" class="input-dark py-2 text-sm">
                            </div>

                            <div class="border-t border-zinc-800/60 my-1 pt-2">
                                <span class="text-[11px] uppercase tracking-wider font-bold text-lime-400 block mb-2">Конструктор правил</span>

                                <div class="flex flex-col gap-2 bg-zinc-900/40 p-2.5 rounded-xl border border-zinc-800/50 mb-2">
                                    <input type="text" id="rule-title" placeholder="Название (например: На проезд)" class="input-dark py-1.5 text-xs">
                                    <input type="text" id="rule-desc" placeholder="Описание/Комментарий..." class="input-dark py-1.5 text-xs">

                                    <div class="grid grid-cols-2 gap-2">
                                        <select id="payment-type" class="input-dark py-1.5 text-xs bg-zinc-900">
                                            <option value="fix">Фикс сумма</option>
                                            <option value="percentage">Процент %</option>
                                        </select>
                                        <input type="text" id="rule-value" placeholder="Значение" class="input-dark py-1.5 text-xs">
                                    </div>

                                    <button onclick="addRuleToTempList()" class="w-full bg-zinc-800 hover:bg-zinc-700 text-title text-[11px] py-1.5 rounded-lg cursor-pointer transition">
                                        + Добавить правило в список
                                    </button>
                                </div>

                                <div id="temp-rules-list" class="text-[11px] text-muted flex flex-col gap-1 max-h-28 overflow-y-auto mb-2 p-1 bg-zinc-950/20 rounded">
                                    <span class="italic text-zinc-600 p-1">Список правил пуст</span>
                                </div>
                            </div>

                            <button onclick="sendTemplateToBackend()" class="w-full btn-gradient py-2.5 rounded-xl cursor-pointer mt-1 text-sm shadow">
                                Сохранить шаблон на бэкенд
                            </button>
                        </div>
                    </div>

                </div>
            </section>
        </div>

    </main>

    <script>
        const API_URL = 'http://127.0.0.1:8000/api';
        let currentTemplatePayments = [];

        // Переменные состояния Drag & Drop
        let draggedItem = null;
        let originIndex = null;
        let donorTemplateName = null;
        let placeholder = null;

        // Форматирование сумм валюты на стороне UI (чистая презентация)
        const formatMoney = (amount) => {
            return new Intl.NumberFormat('ru-KZ', {
                style: 'currency',
                currency: 'KZT',
                maximumFractionDigits: 2
            }).format(amount);
        };

        window.addEventListener('DOMContentLoaded', () => {
            loadAllTemplates();
        });

        function toggleTheme() {
            const body = document.body;
            body.classList.toggle('theme-dark');
            body.classList.toggle('theme-light');
        }

        function validateNumberInput(value) {
            const clean = value.toString().trim().replace(',', '.');
            if (clean === '' || isNaN(Number(clean)) || Number(clean) < 0) {
                alert("⚠️ Ошибка: Введены некорректные символы суммы или отрицательное значение!");
                return null;
            }
            return Number(clean);
        }

        function populateTemplatesDropdown(templates) {
            const datalist = document.getElementById('templates-list');
            if (!datalist) return;

            datalist.innerHTML = templates
                .map(tpl => `<option value="${tpl.name}"></option>`)
                .join('');
        }

        async function loadAllTemplates() {
            const container = document.getElementById('active-templates-container');
            try {
                const response = await fetch(`${API_URL}/templates`);
                if (!response.ok) throw new Error(`HTTP Error ${response.status}`);
                const templates = await response.json();

                populateTemplatesDropdown(templates);

                if (templates.length === 0) {
                    container.innerHTML = '<div class="text-center py-12 text-muted italic">В базе нет созданных шаблонов. Сделайте первый на панели справа!</div>';
                    return;
                }

                container.innerHTML = templates.map(tpl => {
                    const rulesHtml = tpl.payments.map((p, idx) => {
                        const isPercent = p.__type__ === 'Percentage';
                        const badgeText = isPercent ? 'Процент' : 'Фикс';
                        const displayValue = isPercent ? `-${p.value}%` : `-${formatMoney(p.value)}`;
                        const borderHighlight = isPercent ? 'border-l-2 border-l-rose-500/40' : '';

                        return `
                            <div draggable="true"
                                 data-index="${idx}"
                                 data-template="${tpl.name}"
                                 class="draggable-item glass-card p-4 rounded-xl flex justify-between items-center relative pl-12 ${borderHighlight}">

                                <div class="rule-badge absolute left-4 w-5 h-5 rounded-full bg-zinc-800 border border-zinc-700 text-[10px] font-bold text-center leading-5 text-zinc-400 transition-colors duration-200">${idx + 1}</div>

                                <div class="flex-1 pr-4">
                                    <div class="flex items-center gap-2">
                                        <h4 class="font-semibold text-title text-sm">${p.description || 'Без описания'}</h4>
                                        <span class="text-[9px] px-1.5 py-0.5 rounded bg-rose-950/30 text-rose-400 border border-rose-900/20 font-mono uppercase">${badgeText}</span>
                                    </div>
                                </div>

                                <div class="flex items-center gap-3">
                                    <span class="text-base font-bold text-rose-500 mr-1">${displayValue}</span>

                                    <!-- Иконка перемещения -->
                                    <button title="Зажмите и потяните для перемещения"
                                            class="drag-handle p-2 rounded-lg bg-zinc-800/30 hover:bg-zinc-800/80 text-zinc-400 hover:text-zinc-200 border border-zinc-700/30 transition cursor-grab flex items-center justify-center">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <polyline points="8 7 12 3 16 7"></polyline>
                                            <polyline points="8 17 12 21 16 17"></polyline>
                                            <line x1="12" y1="3" x2="12" y2="21"></line>
                                        </svg>
                                    </button>

                                    <!-- Кнопка удаления -->
                                    <button onclick="deleteRule('${tpl.name}', ${idx})"
                                            title="Удалить правило"
                                            class="p-2 rounded-lg bg-rose-950/20 hover:bg-rose-900/50 text-rose-400/70 hover:text-rose-400 border border-rose-900/20 hover:border-rose-800/40 transition cursor-pointer flex items-center justify-center">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <path d="M3 6h18"/>
                                            <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
                                            <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
                                            <line x1="10" y1="11" x2="10" y2="17"/>
                                            <line x1="14" y1="11" x2="14" y2="17"/>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                        `;
                    }).join('');

                    return `
                        <div class="flex flex-col gap-6">
                            <div class="flex items-center justify-between border-b border-zinc-800/50 pb-4 gap-4">
                                <div>
                                    <h2 class="text-2xl font-bold tracking-tight text-title flex items-center gap-2">Шаблон: ${tpl.name}</h2>
                                    <p class="text-xs text-muted mt-0.5">Правила обрабатываются строго по принципу FIFO (сверху вниз)</p>
                                </div>
                                <button onclick="deleteTemplate('${tpl.name}')" class="p-2 text-xs bg-rose-950/40 hover:bg-rose-900 text-rose-400 rounded-xl transition font-medium border border-rose-900/30 cursor-pointer flex items-center gap-1">
                                     Удалить весь шаблон
                                </button>
                            </div>
                            <div class="rules-container flex flex-col gap-3 min-h-[50px] relative before:absolute before:left-6 before:top-4 before:bottom-4 before:w-0.5 before:bg-zinc-800/40" data-template="${tpl.name}">
                                ${rulesHtml}
                            </div>
                        </div>
                    `;
                }).join('');

                initDragAndDrop();

            } catch (err) {
                container.innerHTML = '<div class="text-center py-12 text-rose-400 italic">Ошибка соединения с API при загрузке шаблонов.</div>';
            }
        }

        /* --- Логика Drag and Drop с поддержкой миграции между шаблонами --- */
        function initDragAndDrop() {
            const containers = document.querySelectorAll('.rules-container');

            placeholder = document.createElement('div');
            placeholder.className = 'drop-placeholder';

            containers.forEach(container => {
                const items = container.querySelectorAll('.draggable-item');

                items.forEach(item => {
                    item.addEventListener('dragstart', (e) => {
                        draggedItem = item;
                        originIndex = parseInt(item.getAttribute('data-index'));
                        donorTemplateName = item.getAttribute('data-template');

                        setTimeout(() => item.classList.add('dragging'), 0);
                    });

                    item.addEventListener('dragend', async () => {
                        item.classList.remove('dragging');

                        if (placeholder.parentNode) {
                            const targetContainer = placeholder.parentNode;
                            const targetTemplateName = targetContainer.getAttribute('data-template');

                            let targetIndex = 0;
                            const childrenArr = Array.from(targetContainer.children);

                            for (let i = 0; i < childrenArr.length; i++) {
                                if (childrenArr[i] === placeholder) break;
                                if (childrenArr[i] !== draggedItem) {
                                    targetIndex++;
                                }
                            }

                            placeholder.parentNode.replaceChild(draggedItem, placeholder);
                            draggedItem.setAttribute('data-template', targetTemplateName);

                            updateIndexes(targetContainer);
                            const donorContainer = document.querySelector(`.rules-container[data-template="${donorTemplateName}"]`);
                            if (donorContainer && donorContainer !== targetContainer) {
                                updateIndexes(donorContainer);
                            }

                            if (donorTemplateName === targetTemplateName) {
                                if (originIndex !== targetIndex) {
                                    await sendCustomizeRequest(donorTemplateName, originIndex, targetIndex);
                                }
                            } else {
                                await sendImmigrationRequest(donorTemplateName, originIndex, targetTemplateName, targetIndex);
                            }
                        }

                        draggedItem = null;
                        originIndex = null;
                        donorTemplateName = null;
                        placeholder.className = 'drop-placeholder';
                    });
                });

                container.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    if (!draggedItem) return;

                    const currentTargetTemplate = container.getAttribute('data-template');

                    if (currentTargetTemplate === donorTemplateName) {
                        placeholder.className = 'drop-placeholder internal';
                    } else {
                        placeholder.className = 'drop-placeholder foreign';
                    }

                    const afterElement = getDragAfterElement(container, e.clientY);

                    if (afterElement == null) {
                        container.appendChild(placeholder);
                    } else {
                        container.insertBefore(placeholder, afterElement);
                    }

                    const currentPlaceholderIndex = Array.from(container.children).indexOf(placeholder);
                    const badge = draggedItem.querySelector('.rule-badge');
                    if (badge) {
                        badge.textContent = currentPlaceholderIndex + 1;
                        if (currentTargetTemplate === donorTemplateName) {
                            badge.className = 'rule-badge absolute left-4 w-5 h-5 rounded-full bg-lime-400 text-zinc-950 font-bold text-center leading-5 text-[10px] transition-colors duration-200';
                        } else {
                            badge.className = 'rule-badge absolute left-4 w-5 h-5 rounded-full bg-amber-400 text-zinc-950 font-bold text-center leading-5 text-[10px] transition-colors duration-200';
                        }
                    }
                });
            });
        }

        function getDragAfterElement(container, y) {
            const draggableElements = [...container.querySelectorAll('.draggable-item:not(.dragging)')];

            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;
                if (offset < 0 && offset > closest.offset) {
                    return { offset: offset, element: child };
                } else {
                    return closest;
                }
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        function updateIndexes(container) {
            const items = container.querySelectorAll('.draggable-item');
            items.forEach((item, idx) => {
                item.setAttribute('data-index', idx);
                const badge = item.querySelector('.rule-badge');
                if (badge) {
                    badge.textContent = idx + 1;
                    badge.className = 'rule-badge absolute left-4 w-5 h-5 rounded-full bg-zinc-800 border border-zinc-700 text-[10px] font-bold text-center leading-5 text-zinc-400 transition-colors duration-200';
                }
            });
        }

        async function sendCustomizeRequest(name, originIndex, targetIndex) {
            try {
                const url = `${API_URL}/templates/${encodeURIComponent(name)}?origin_index=${originIndex}&target_index=${targetIndex}`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (!response.ok) {
                    const data = await response.json();
                    alert("Ошибка кастомизации: " + (data.detail || response.statusText));
                    await loadAllTemplates();
                }
            } catch (err) {
                alert("Ошибка сети при перестановке правил: " + err.message);
                await loadAllTemplates();
            }
        }

        async function sendImmigrationRequest(donorName, originIndex, targetTemplate, targetIndex) {
            try {
                const url = `${API_URL}/templates/${encodeURIComponent(donorName)}?donour_name=${encodeURIComponent(donorName)}&origin_index=${originIndex}&target_template=${encodeURIComponent(targetTemplate)}&target_index=${targetIndex}`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (!response.ok) {
                    const data = await response.json();
                    alert("Ошибка при перемещении правила в другой шаблон: " + (data.detail || response.statusText));
                    await loadAllTemplates();
                }
            } catch (err) {
                alert("Ошибка сети при иммиграции правила: " + err.message);
                await loadAllTemplates();
            }
        }

        async function deleteRule(templateName, index) {
            if (!confirm(`Удалить правило №${index + 1} из шаблона "${templateName}"?`)) return;

            try {
                const response = await fetch(`${API_URL}/templates/${encodeURIComponent(templateName)}?index=${index}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    await loadAllTemplates();
                } else {
                    const data = await response.json();
                    alert("Ошибка при удалении правила: " + (data.detail || response.statusText));
                }
            } catch (err) {
                alert("Ошибка сети при удалении правила: " + err.message);
            }
        }

        async function deleteTemplate(name) {
            if (!confirm(`Вы действительно хотите удалить весь шаблон "${name}"?`)) return;
            try {
                const response = await fetch(`${API_URL}/templates/${encodeURIComponent(name)}`, { method: 'DELETE' });
                if (response.ok) {
                    await loadAllTemplates();
                } else {
                    alert("Не удалось удалить шаблон");
                }
            } catch (err) {
                alert("Ошибка удаления: " + err.message);
            }
        }

        function addRuleToTempList() {
            const title = document.getElementById('rule-title').value.trim();
            const desc = document.getElementById('rule-desc').value.trim();
            const type = document.getElementById('payment-type').value;
            const rawValue = document.getElementById('rule-value').value;

            const value = validateNumberInput(rawValue);
            if (value === null || !title) {
                if (!title) alert("Введите название правила!");
                return;
            }

            const finalDescription = desc ? `${title} (${desc})` : title;

            currentTemplatePayments.push({
                type: type,
                value: value,
                description: finalDescription
            });

            document.getElementById('rule-title').value = '';
            document.getElementById('rule-desc').value = '';
            document.getElementById('rule-value').value = '';

            renderTempRules();
        }

        function renderTempRules() {
            const container = document.getElementById('temp-rules-list');
            if (currentTemplatePayments.length === 0) {
                container.innerHTML = '<span class="italic text-zinc-600 p-1">Список правил пуст</span>';
                return;
            }
            container.innerHTML = currentTemplatePayments.map((p, idx) =>
                `<div class="p-1 bg-zinc-900/60 rounded mb-1 text-title flex justify-between items-center text-[11px]">
                    <span>${idx + 1}. <b>${p.type === 'fix' ? 'ФИКС' : 'ПРОЦЕНТ'}</b>: ${p.value}${p.type === 'fix' ? ' ₸' : '%'} — <i>${p.description}</i></span>
                    <button onclick="removeTempRule(${idx})" class="text-rose-400 hover:text-rose-500 px-1 font-bold">✕</button>
                 </div>`
            ).join('');
        }

        function removeTempRule(index) {
            currentTemplatePayments.splice(index, 1);
            renderTempRules();
        }

        async function sendTemplateToBackend() {
            const name = document.getElementById('tpl-name').value.trim();
            if (!name || currentTemplatePayments.length === 0) {
                alert("Введите имя шаблона и наберите список правил!");
                return;
            }

            const payload = { name: name, payments: currentTemplatePayments };

            try {
                const response = await fetch(`${API_URL}/templates`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    currentTemplatePayments = [];
                    document.getElementById('tpl-name').value = '';
                    renderTempRules();
                    await loadAllTemplates();
                } else {
                    const data = await response.json();
                    alert("Ошибка бэка: " + data.detail);
                }
            } catch (err) {
                alert("Ошибка отправки: " + err.message);
            }
        }

        async function sendToCalculation() {
            const templateName = document.getElementById('calc-template-name').value.trim();
            const rawAmount = document.getElementById('calc-amount').value;

            const amount = validateNumberInput(rawAmount);
            if (amount === null || !templateName) {
                if (!templateName) alert("Укажите имя шаблона!");
                return;
            }

            try {
                const response = await fetch(`${API_URL}/calculate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ template_name: templateName, amount: amount })
                });
                const data = await response.json();

                if (response.ok && data.status !== "error") {
                    const r = data.result;
                    renderCalculationOutput(r);
                } else {
                    alert("Ошибка: " + (data.message || data.detail));
                }
            } catch (err) {
                alert("Ошибка сети: " + err.message);
            }
        }

        // --- Вся логика отображения результатов расчета перенесена на фронтенд ---
        function renderCalculationOutput(r) {
            const container = document.getElementById('active-templates-container');

            const oldResult = document.getElementById('calc-output-card');
            if (oldResult) oldResult.remove();

            const historyItems = (r.history || []).map(item => {
                let statusBadge = '';
                let borderStyle = 'border-zinc-800/60';
                let displayDeducted = '';

                // Определение текста статуса
                if (item.status === 'ok') {
                    statusBadge = '<span class="text-[10px] text-emerald-400 font-semibold">Успешно</span>';
                } else if (item.status === 'insufficient_funds') {
                    statusBadge = '<span class="text-[10px] text-rose-400 font-semibold">Ошибка: Не хватило средств</span>';
                    borderStyle = 'border-rose-500/50 bg-rose-950/20';
                } else if (item.status === 'zero_balance_stop') {
                    statusBadge = '<span class="text-[10px] text-amber-400 font-semibold">Остановка: Баланс 0 ₸</span>';
                    borderStyle = 'border-amber-500/50 bg-amber-950/20';
                }

                // Форматирование вычитаемой суммы (используется если бэкенд не прислал display_deducted)
                if (item.display_deducted) {
                    displayDeducted = item.display_deducted;
                } else if (item.status === 'zero_balance_stop' && item.type === 'percentage') {
                    displayDeducted = `${item.value}% (0 ₸)`;
                } else if (item.type === 'percentage') {
                    displayDeducted = `${item.value}% (${formatMoney(item.deducted_amount)})`;
                } else {
                    displayDeducted = formatMoney(item.deducted_amount);
                }

                return `
                    <div class="glass-card p-3 rounded-xl border ${borderStyle} flex flex-col gap-1 text-xs">
                        <div class="flex justify-between items-center">
                            <span class="font-bold text-title">${item.step}. ${item.description}</span>
                            ${statusBadge}
                        </div>
                        <div class="flex justify-between items-center text-muted text-[11px] mt-1">
                            <span>Вычитаемая сумма: <b class="text-rose-400">${displayDeducted}</b></span>
                            <span>Остаток: <b class="text-lime-400">${formatMoney(item.balance_after)}</b></span>
                        </div>
                    </div>
                `;
            }).join('');

            const outputHtml = `
                <div id="calc-output-card" class="glass-card p-6 rounded-2xl border-l-4 ${r.success ? 'border-l-lime-400' : 'border-l-rose-500'} mb-8">
                    <div class="flex justify-between items-center mb-4">
                        <div>
                            <h3 class="text-xl font-bold text-title">Детализация: ${r.template_name}</h3>
                            <p class="text-xs text-muted">Исходный баланс: ${formatMoney(r.initial_amount)} | Остаток: ${formatMoney(r.final_balance)}</p>
                        </div>
                        <button onclick="document.getElementById('calc-output-card').remove()" class="text-muted hover:text-title text-sm cursor-pointer">✕ Закрыть</button>
                    </div>

                    <div class="flex flex-col gap-2 mt-4">
                        ${historyItems}
                    </div>
                </div>
            `;

            container.insertAdjacentHTML('afterbegin', outputHtml);
        }
    </script>
</body>
</html>
